<html lang="zh-CN">

<style>/* ============================================================
   macOS 现代桌面 · ARG 模板样式
   顶部菜单栏 + 访达风格窗口（侧边栏/内容/口令） + 玻璃 Dock
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body.arg-desktop {
  font-family: var(--arg-font-family, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif);
  color: var(--arg-text-color, #1d1d1f);
  -webkit-font-smoothing: antialiased;
}

.desktop {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--arg-bg-color, #0e1116);
}

/* ---------------- 壁纸层 ---------------- */
.desktop__wallpaper {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 78% 18%, rgba(64, 96, 178, 0.55) 0%, transparent 55%),
    radial-gradient(90% 80% at 18% 78%, rgba(122, 64, 158, 0.45) 0%, transparent 55%),
    linear-gradient(160deg, #10131c 0%, #1b2030 45%, #0a0c12 100%);
}
.desktop__vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
}

/* ---------------- 顶部菜单栏 ---------------- */
.menubar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 26px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: rgba(34, 34, 40, 0.82);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  color: rgba(255, 255, 255, 0.92);
  font-size: 13px;
  user-select: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.menubar__left,
.menubar__right {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
}
.menubar__logo {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8ea8d8 0%, #4a6bb5 60%, #243d78 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  display: inline-block;
}
.menubar__item { color: rgba(255, 255, 255, 0.85); }
.menubar__item--strong { font-weight: 600; color: #fff; }
.menubar__icon { font-size: 12px; opacity: 0.75; }
.menubar__clock { font-variant-numeric: tabular-nums; opacity: 0.95; }
@media (max-width: 640px) {
  .menubar__item--hide-sm { display: none; }
}

/* ---------------- 主窗口 ---------------- */
.window {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -52%);
  width: min(840px, 94vw);
  max-height: 76vh;
  display: flex;
  flex-direction: column;
  background: var(--arg-card-bg, #f5f5f7);
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.55),
    0 2px 6px rgba(0, 0, 0, 0.35),
    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  z-index: 50;
}
.window__titlebar {
  height: 42px;
  flex: 0 0 42px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: linear-gradient(180deg, #ffffff 0%, #e9e9ec 100%);
  border-bottom: 1px solid #d4d4d8;
  position: relative;
}
.traffic { display: flex; gap: 8px; }
.traffic__dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.traffic__dot--close { background: #ff5f57; }
.traffic__dot--min   { background: #febc2e; }
.traffic__dot--max   { background: #28c840; }
.window__title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: #3a3a3c;
  text-align: center;
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 110px;
}
.window__tools { margin-left: auto; display: flex; gap: 10px; color: #8e8e93; font-size: 13px; }
.window__tool { cursor: default; }

.window__body {
  flex: 1;
  display: flex;
  min-height: 0;
}
@media (max-width: 560px) {
  .window__body { flex-direction: column; }
}

/* ---------------- 侧边栏 ---------------- */
.sidebar {
  width: 188px;
  flex: 0 0 188px;
  padding: 14px 10px;
  background: rgba(236, 236, 239, 0.9);
  border-right: 1px solid #d8d8dc;
  overflow-y: auto;
}
@media (max-width: 560px) {
  .sidebar { width: 100%; flex: none; border-right: none; border-bottom: 1px solid #d8d8dc; }
}
.sidebar__heading {
  margin: 10px 8px 6px;
  font-size: 11px;
  font-weight: 600;
  color: #6e6e73;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.sidebar__static {
  display: block;
  padding: 5px 8px;
  font-size: 13px;
  color: #48484a;
}
.arg-link-item {
  display: block;
  text-decoration: none;
  padding: 7px 10px;
  margin: 2px 0;
  border-radius: 7px;
  color: #1d1d1f;
  cursor: pointer;
  transition: background 0.15s ease;
}
.arg-link-item:hover { background: rgba(0, 0, 0, 0.06); }
.arg-link-title { display: block; font-size: 13px; font-weight: 500; }
.arg-link-desc { display: block; font-size: 11px; color: #8e8e93; margin-top: 2px; }

/* ---------------- 内容区 ---------------- */
.window__content {
  flex: 1;
  min-width: 0;
  padding: 24px 28px 28px;
  overflow-y: auto;
  background: #ffffff;
}
@media (max-width: 560px) { .window__content { padding: 16px; } }
.content__image {
  display: block;
  max-width: 100%;
  max-height: 240px;
  border-radius: 10px;
  margin: 0 auto 16px;
  object-fit: cover;
}
.content__image[src=""],
.content__image:not([src]) { display: none; }
.content__title {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 700;
  color: #1d1d1f;
}
.content__date {
  margin: 0 0 14px;
  font-size: 12px;
  color: #8e8e93;
  font-variant-numeric: tabular-nums;
}
.content__body {
  font-size: 14.5px;
  line-height: 1.75;
  color: #3a3a3c;
  white-space: normal;
}
.content__body br { content: ""; display: block; margin: 6px 0; }

.content__field {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #e5e5ea;
}
.content__label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #6e6e73;
  margin-bottom: 8px;
}
.content__row { display: flex; gap: 10px; }
.content__input {
  flex: 1;
  min-width: 0;
  padding: 9px 12px;
  font-size: 14px;
  border: 1px solid #d1d1d6;
  border-radius: 8px;
  outline: none;
  background: #fff;
  color: #1d1d1f;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.content__input:focus {
  border-color: var(--arg-primary-color, #0a84ff);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18);
}
.content__submit {
  padding: 9px 20px;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  background: var(--arg-primary-color, #0a84ff);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: filter 0.15s ease;
}
.content__submit:hover { filter: brightness(1.12); }
.content__submit:active { filter: brightness(0.94); }

/* ---------------- Dock ---------------- */
.dock {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.32);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  backdrop-filter: blur(24px) saturate(1.6);
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
}
.dock__item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
  transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: default;
}
.dock__item[data-arg-link] { cursor: pointer; }
.dock__item:hover {
  transform: translateY(-8px) scale(1.12);
}
.dock__glyph {
  font-size: 22px;
  line-height: 1;
  color: #3a3a3c;
}
.dock__glyph--mono {
  font-family: "SF Mono", "Menlo", Consolas, monospace;
  font-weight: 700;
}
.dock__sep {
  width: 1px;
  height: 38px;
  align-self: center;
  background: rgba(255, 255, 255, 0.5);
  margin: 0 4px;
}

/* 聊天图标 · 新消息红点 */
.dock__item--chat::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ff3b30;
  border: 1.5px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 6px rgba(255, 59, 48, 0.85);
  animation: arg-badge-pulse 1.6s ease-in-out infinite;
}
@keyframes arg-badge-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.72; transform: scale(1.18); }
}

@media (max-width: 560px) {
  .dock { gap: 6px; padding: 6px 8px; border-radius: 16px; }
  .dock__item { width: 38px; height: 38px; }
  .dock__glyph { font-size: 18px; }
}
